on:
  - push
  - pull_request

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/_vcpkg_cache

jobs:
  build:
    strategy:
      matrix:
        os: [linux, mac, windows]
        include:
        - os: linux
          image: ubuntu-latest
        - os: mac
          image: macos-latest
        - os: windows
          image: windows-latest
          cmake_args: -A x64
      fail-fast: false
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - run: mkdir _vcpkg_cache
      - uses: actions/cache@v4
        env:
          cache_name: vcpkg
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-build-${{ env.cache_name }}-${{ hashFiles('vcpkg.cmake', 'vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache_name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - run: cmake -S . -B _build -DCMAKE_BUILD_TYPE=Release -DM2S_ENABLE_JPEG=ON -DM2S_ENABLE_PNG=ON -DM2S_ENABLE_TIFF=ON -DM2S_ENABLE_EXR=ON ${{ matrix.cmake_args }}
      - run: cmake --build _build --config Release
